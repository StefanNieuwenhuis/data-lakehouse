---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only calls make targets (ADR-0003). Every action is pinned to a full
# commit SHA, with its release tag in the trailing comment.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # Keep in sync with [tool.uv] required-version in pyproject.toml.
          version: "0.11.6"

      - name: Install pinned toolchain from uv.lock
        run: uv sync --frozen

      - name: make lint
        run: make lint

      - name: make test
        run: make test

  helm-template:
    name: helm-template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v4.3.1  # keep in sync with the local Helm version

      - name: make helm-template
        run: make helm-template
