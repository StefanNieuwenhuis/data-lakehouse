---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only calls make targets (ADR-0003). Every action is pinned to a full
# commit SHA, with its release tag in the trailing comment. Runner images are
# pinned too (never ubuntu-latest). Each check has its own job.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # Keep in sync with [tool.uv] required-version in pyproject.toml.
          version: "0.11.6"

      - name: Install pinned toolchain from uv.lock
        run: uv sync --frozen

      # make lint fetches lychee by exact version into .tools/bin and checks
      # its sha256 (tests/charts/ensure_tool.sh, pins in mk/lint.mk).
      - name: make lint
        run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # Keep in sync with [tool.uv] required-version in pyproject.toml.
          version: "0.11.6"

      - name: Install pinned toolchain from uv.lock
        run: uv sync --frozen

      # jq and lychee by exact version, sha256-verified, into .tools/bin
      # (tests/charts/ensure_tool.sh, pins in mk/lint.mk). The image's jq is
      # a different version, so the pinned one is fetched, and make test puts
      # .tools/bin first on PATH. make test would do this too; the separate
      # step shows the versions in the log.
      - name: make check-jq check-lychee
        run: make check-jq check-lychee

      - name: make test
        run: make test

  helm-template:
    name: helm-template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v4.3.1  # keep in sync with the local Helm version

      - name: make helm-template
        run: make helm-template

  # The hooks run under the system python3 (3.9 on macOS), not the uv venv, so
  # their stdlib-only unittest suite runs on a bare 3.9 and on 3.12. This job
  # calls unittest directly, not a make target: the make targets run through
  # the uv venv, which needs Python 3.12 (issue #13).
  hook-test:
    name: hook-test (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Hook tests (stdlib unittest, no uv venv)
        run: python -m unittest discover -s .claude/hooks/tests -v
