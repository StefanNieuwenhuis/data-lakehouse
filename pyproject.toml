[project]
name = "lakehouse"
version = "0.0.0"
description = "Local data lakehouse on minikube: lint and test toolchain."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
# Exact pins (ADR-0003). Bump deliberately and commit the regenerated uv.lock.
dev = [
    "actionlint-py==1.7.12.25",
    "check-jsonschema==0.39.0",
    # Node and npm for commitlint and branch-name-lint (tests/conventions/package-lock.json).
    "nodejs-wheel==24.19.0",
    "pymarkdownlnt==0.9.42",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "shellcheck-py==0.11.0.1",
    "sqlfluff==4.5.0",
    "yamllint==1.38.0",
]

[tool.uv]
# Not an installable package; this project only pins the toolchain.
package = false
# Keep in sync with the `version:` of astral-sh/setup-uv in .github/workflows/ci.yml.
required-version = "==0.11.6"

[tool.ruff]
target-version = "py312"

[tool.ruff.per-file-target-version]
# The Claude Code hooks run under the system python3 (3.9 on macOS), not the uv
# venv, so ruff flags any syntax newer than 3.9 there.
".claude/**" = "py39"

[tool.pytest.ini_options]
testpaths = ["tests", ".claude/hooks/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.pymarkdown]
# Markdown lint (pymarkdownlnt), run by `make lint-markdown`. Every rule is on
# except the ones listed here, each with its reason.
# Agent and slash-command files start with YAML front matter (Claude Code reads
# it). Without this extension the front matter is parsed as Markdown.
extensions.front-matter.enabled = true
# MD013 (line-length): off. The docs keep one paragraph or list item per line,
# so diffs follow sentences; hard-wrapping at 80 columns would rewrap every doc.
plugins.md013.enabled = false
# MD041 (first-line-h1): stays on. Agent and slash-command files are prompts
# whose title is the front-matter `description`, so that counts as the title.
plugins.md041.front_matter_title = "description"
