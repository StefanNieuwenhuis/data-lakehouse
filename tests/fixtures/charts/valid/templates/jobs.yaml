---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-once"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: "{{ .Values.image }}"
          command: ["sh", "-c", "true"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Release.Name }}-nightly"
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: run
              image: "{{ .Values.image }}"
              command: ["sh", "-c", "true"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 50m, memory: 32Mi}
